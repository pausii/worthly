name = "wallet-tracker"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Aset statis frontend yang di-self-host (Tailwind CSS + Alpine + Chart.js),
# di-build oleh `npm run build:assets` ke ./public. Permintaan non-aset jatuh ke Worker.
[assets]
directory = "./public"

# Metadata versi deploy (id berubah tiap deploy) — dipakai untuk deteksi update PWA.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Workers Observability: simpan log (console.*) + metrik di dashboard Cloudflare.
# head_sampling_rate = 1 -> simpan 100% log (traffic kecil, aman).
[observability]
enabled = true
head_sampling_rate = 1

# Jalankan sinkronisasi CEX/on-chain tiap 10 menit.
[triggers]
crons = ["*/10 * * * *"]

# Cloudflare D1 (buat dulu: `npm run db:create`, lalu tempel database_id di sini)
[[d1_databases]]
binding = "DB"
database_name = "wallet_db"
database_id = "9f363266-8f6a-438b-b4cd-139cf48435d0"
migrations_dir = "migrations"

# Cloudflare KV untuk session + rate limit + cache harga
# (buat dulu: `npm run kv:create`, lalu tempel id di sini)
[[kv_namespaces]]
binding = "KV"
id = "59427ae1102c453a9e61dc34a94a29fc"

# Cloudflare Workers AI — inferensi LLM untuk "AI Insight" portofolio.
# Tidak perlu id; cukup binding. Gratis 10.000 Neuron/hari (reset 00:00 UTC).
[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
# Default jadwal snapshot nilai portofolio (menit). Sync balance tetap tiap 10 menit.
SNAPSHOT_INTERVAL_MINUTES = "30"
# Workers Free: batas CPU per-invocation ketat. Sinkron sebagian account per tick (round-robin)
# agar tiap cron lebih ringan. 0/kosong = sinkron semua. Naikkan/turunkan sesuai jumlah account.
SYNC_BATCH_SIZE = "2"

# === SECRETS (JANGAN ditaruh di sini — set via `wrangler secret put`) ===
# wrangler secret put MASTER_KEY          -> base64 dari 32 byte acak (kunci enkripsi kredensial)
# wrangler secret put COINGECKO_API_KEY   -> opsional
# Endpoint RPC boleh disimpan per-account (terenkripsi di D1) ATAU sebagai secret default.
# EVM pakai Alchemy (mis. https://eth-mainnet.g.alchemy.com/v2/KEY), TRON pakai TronGrid,
# Solana pakai JSON-RPC apa pun (Helius/QuickNode/Alchemy).
# wrangler secret put RPC_ETH_URL         -> Alchemy Ethereum
# wrangler secret put RPC_BSC_URL         -> Alchemy BNB Smart Chain
# wrangler secret put RPC_TRON_URL        -> TronGrid (mis. https://api.trongrid.io)
# wrangler secret put RPC_TRON_API_KEY    -> opsional, TronGrid API key (hindari rate-limit)
# wrangler secret put RPC_SOL_URL         -> SANGAT disarankan, mis. Helius free tier.
#                                            api.mainnet-beta.solana.com memblokir IP Cloudflare Workers;
#                                            tanpa ini dipakai endpoint publik yang sering kena 429.
# wrangler secret put BINANCE_PROXY_URL   -> HTTP CONNECT proxy bypass geo-block Binance
#                                            format: http://user:pass@host:port (opsional)
# wrangler secret put GRAPHIQL_PASSWORD   -> opsional, password proteksi untuk membuka konsol /graphql
