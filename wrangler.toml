name = "wallet-tracker"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Jalankan sinkronisasi CEX/on-chain tiap 2 menit.
[triggers]
crons = ["*/2 * * * *"]

# Cloudflare D1 (buat dulu: `npm run db:create`, lalu tempel database_id di sini)
[[d1_databases]]
binding = "DB"
database_name = "wallet_db"
database_id = "9f363266-8f6a-438b-b4cd-139cf48435d0"
migrations_dir = "migrations"

# Cloudflare KV untuk session + rate limit + cache harga
# (buat dulu: `npm run kv:create`, lalu tempel id di sini)
[[kv_namespaces]]
binding = "KV"
id = "59427ae1102c453a9e61dc34a94a29fc"

[vars]
ENVIRONMENT = "production"
# Default jadwal snapshot nilai portofolio (menit). Sync balance tetap tiap 2 menit.
SNAPSHOT_INTERVAL_MINUTES = "30"

# === SECRETS (JANGAN ditaruh di sini — set via `wrangler secret put`) ===
# wrangler secret put MASTER_KEY          -> base64 dari 32 byte acak (kunci enkripsi kredensial)
# wrangler secret put COINGECKO_API_KEY   -> opsional
# Endpoint RPC boleh disimpan per-account (terenkripsi di D1) ATAU sebagai secret default.
# EVM pakai Alchemy (mis. https://eth-mainnet.g.alchemy.com/v2/KEY), TRON pakai TronGrid.
# wrangler secret put RPC_ETH_URL         -> Alchemy Ethereum
# wrangler secret put RPC_BSC_URL         -> Alchemy BNB Smart Chain
# wrangler secret put RPC_TRON_URL        -> TronGrid (mis. https://api.trongrid.io)
# wrangler secret put RPC_TRON_API_KEY    -> opsional, TronGrid API key (hindari rate-limit)
# wrangler secret put BINANCE_PROXY_URL   -> HTTP CONNECT proxy bypass geo-block Binance
#                                            format: http://user:pass@host:port (opsional)
